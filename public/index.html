<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>MIDI 歌词 → 字幕编辑器</title>
    <!-- 内联 favicon:避免每次加载都去打 /favicon.ico 然后 404,污染控制台与网络面板 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Crect x='6' y='9' width='20' height='4' rx='1.5' fill='%234ea1ff'/%3E%3Crect x='6' y='16' width='13' height='4' rx='1.5' fill='%23ffd166'/%3E%3Crect x='6' y='23' width='17' height='4' rx='1.5' fill='%234ea1ff'/%3E%3C/svg%3E"
    />
    <!-- 相对路径:静态部署(dist/static)挂在任何子路径下都不需要改 -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
  </head>
  <body>
    <div id="app" class="app" data-ready="false" data-mode="list">
      <header id="toolbar" class="toolbar" role="toolbar" aria-label="主工具栏"></header>

      <div id="banner" class="banner" role="alert" hidden></div>

      <main class="workspace">
        <aside id="track-panel" class="panel panel--tracks" aria-label="轨道面板">
          <div class="panel__head">
            <span class="panel__title">轨道</span>
            <span id="track-count" class="muted"></span>
          </div>
          <div id="track-list" class="panel__body"></div>
        </aside>

        <section id="stage" class="stage" aria-label="时间轴">
          <div id="stage-toolbar" class="stage__toolbar"></div>
          <div id="timeline-wrap" class="timeline-wrap">
            <canvas id="timeline" class="timeline" hidden></canvas>
            <div id="timeline-fallback" class="timeline-fallback" hidden></div>
            <!-- 滚动条:时间轴比视口长得多,没有可见滚动条用户根本不知道能滚。
                 横条拖 = 平移时间;竖条拖 = 切换泳道。 -->
            <div id="hbar" class="sbar sbar--h" hidden><div class="sbar__thumb" id="hbar-thumb"></div></div>
            <div id="vbar" class="sbar sbar--v" hidden><div class="sbar__thumb" id="vbar-thumb"></div></div>
          </div>
        </section>

        <aside id="props-panel" class="panel panel--props" aria-label="属性面板">
          <div class="panel__head">
            <span class="panel__title">属性</span>
            <span id="props-hint" class="muted"></span>
          </div>
          <div id="props-list" class="panel__body"></div>
        </aside>
      </main>

      <footer id="statusbar" class="statusbar" role="status" aria-live="polite"></footer>
    </div>

    <div id="modal-root" class="modal-root" hidden></div>
    <div id="toast" class="toast" hidden></div>

    <input
      id="midi-file"
      class="visually-hidden"
      type="file"
      accept=".mid,.midi,audio/midi,audio/x-midi"
      tabindex="-1"
      aria-hidden="true"
    />

    <script type="module" src="js/ui.js"></script>
  </body>
</html>
